version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Preserve existing Laravel/PHP compatibility when adding newer versions.
    versioning-strategy: widen
    commit-message:
      prefix: "📦 Deps"
    groups:
      composer-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "📦 Deps"
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "📦 Deps"
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
