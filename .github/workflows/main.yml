name: run-tests

on:
    push:
        branches: [main, 'release/**']
    pull_request:
        branches: [main, 'release/**']

jobs:
    release-tooling:
        name: Commit conventions and release tooling
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
            - name: Require prepared release PRs for main
              if: github.event_name == 'pull_request'
              env:
                BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
                HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
                HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              shell: bash
              run: |
                set -euo pipefail
                if [ "$BASE_BRANCH" = main ]; then
                    git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
                fi
                node .release/branches.mjs check-pr --base "$BASE_BRANCH" --head "$HEAD_BRANCH" --ref "$HEAD_SHA" --base-ref refs/remotes/origin/main
            - name: Check new commit messages
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
                  HEAD_SHA: ${{ github.sha }}
              run: |
                  # A force push can remove the previous tip from the fetched history.
                  # Fetch that exact commit so the check still covers the full push.
                  if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] &&
                     ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
                      git fetch --no-tags origin "$BASE_SHA"
                  fi
                  node .github/scripts/releases.mjs check-commits --base "$BASE_SHA" --ref "$HEAD_SHA"
            - name: Test release tooling
              run: |
                  node --test .release/release.test.mjs .release/changelog.test.mjs .release/branches.test.mjs

    python:
        name: Python ${{ matrix.python }} - ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                python: ['3.11', '3.14']
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python }}
                  cache: pip
                  cache-dependency-path: python/requirements.txt
            - name: Install decoder dependencies
              run: |
                  python -m pip install --only-binary=:all: -r python/requirements.txt
            - name: Check decoder dependencies
              run: python -m pip check
            - name: Test real QR image decoding
              run: python -m unittest discover -s python -p 'test_*.py' -v

    test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                framework:
                    - laravel: '12.*'
                      testbench: ^10.0
                      php: '8.2'
                    - laravel: '13.*'
                      testbench: ^11.0
                      php: '8.3'
                stability: [prefer-lowest, prefer-stable]
                include:
                    - os: ubuntu-latest
                      framework:
                          laravel: '13.*'
                          testbench: ^11.0
                          php: '8.5'
                      stability: prefer-stable

        name: P${{ matrix.framework.php }} - L${{ matrix.framework.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.framework.php }}
                  tools: composer:v2
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
                  coverage: none

            - name: Setup problem matchers
              run: |
                  echo "::add-matcher::${{ runner.tool_cache }}/php.json"
                  echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"
            - name: Setup Python for PHP integration tests
              uses: actions/setup-python@v6
              with:
                  python-version: '3.11'
                  cache: pip
                  cache-dependency-path: python/requirements.txt
            - name: Install Python integration environment
              run: |
                  python -m venv python/venv
                  python -c "import os, subprocess; p = 'python/venv/' + ('Scripts/python.exe' if os.name == 'nt' else 'bin/python'); subprocess.check_call([p, '-m', 'pip', 'install', '--only-binary=:all:', '-r', 'python/requirements.txt'])"
            - name: Install dependencies
              run: |
                  composer require --dev "laravel/framework:${{ matrix.framework.laravel }}" "orchestra/testbench:${{ matrix.framework.testbench }}" --no-interaction --no-update
                  composer update --${{ matrix.stability }} --prefer-dist --no-interaction
            - name: Execute tests
              run: composer test
