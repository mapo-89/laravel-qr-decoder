name: run-tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    release-tooling:
        name: Commit conventions and release tooling
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - name: Check new commit messages
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
                  HEAD_SHA: ${{ github.sha }}
              run: node .github/scripts/releases.mjs check-commits --base "$BASE_SHA" --ref "$HEAD_SHA"
            - name: Test release tooling
              run: |
                  node --test .release/release.test.mjs .release/changelog.test.mjs

    test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                framework:
                    - laravel: '11.*'
                      testbench: ^9.0
                      php: '8.2'
                    - laravel: '12.*'
                      testbench: ^10.0
                      php: '8.2'
                    - laravel: '13.*'
                      testbench: ^11.0
                      php: '8.3'
                stability: [prefer-lowest, prefer-stable]
                include:
                    - os: ubuntu-latest
                      framework:
                          laravel: '13.*'
                          testbench: ^11.0
                          php: '8.5'
                      stability: prefer-stable

        name: P${{ matrix.framework.php }} - L${{ matrix.framework.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.framework.php }}
                  tools: composer:v2
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
                  coverage: none

            - name: Setup problem matchers
              run: |
                  echo "::add-matcher::${{ runner.tool_cache }}/php.json"
                  echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"
            # Laravel 11 is EOL, but remains part of the package's compatibility contract.
            # Allow only its framework advisories during CI resolution; keep audit reporting
            # and advisory blocking for all other packages and Laravel versions enabled.
            - name: Allow Laravel 11 compatibility dependencies
              if: matrix.framework.laravel == '11.*'
              shell: php {0}
              run: |
                  <?php
                  $composer = json_decode(file_get_contents('composer.json'), true, 512, JSON_THROW_ON_ERROR);
                  $composer['config']['policy']['advisories']['ignore']['laravel/framework'] = [
                      'constraint' => '11.*',
                      'on-audit' => false,
                      'reason' => 'CI-only Laravel 11 compatibility test',
                  ];
                  file_put_contents('composer.json', json_encode($composer, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR).PHP_EOL);

            - name: Install dependencies
              run: |
                  composer require --dev "laravel/framework:${{ matrix.framework.laravel }}" "orchestra/testbench:${{ matrix.framework.testbench }}" --no-interaction --no-update
                  composer update --${{ matrix.stability }} --prefer-dist --no-interaction
            - name: Execute tests
              run: composer test
